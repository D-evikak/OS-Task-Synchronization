
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readers-Writers Semaphore Simulation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f7fb;
            color: #222;
        }

        h1 {
            color: #244b8f;
        }

        .summary {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px #00000015;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #244b8f;
            color: white;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #244b8f;
            color: white;
        }

        .reader {
            background: #e1f5e7;
        }

        .writer {
            background: #fff0d8;
        }

        #status {
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
</head>

<body>
    <h1>Readers-Writers Semaphore Simulation</h1>

    <p>
        This simulation displays events recorded by the Java
        Readers-Writers synchronization program.
    </p>

    <div class="summary">
        <div class="card">Readers: <strong id="readerCount">0</strong></div>
        <div class="card">Writers: <strong id="writerCount">0</strong></div>
        <div class="card">Events: <strong id="eventCount">0</strong></div>
    </div>

    <p id="status">Waiting for execution data...</p>

    <button onclick="play()">Play</button>
    <button onclick="pause()">Pause</button>
    <button onclick="resetView()">Reset</button>
    <button onclick="showAll()">Show All Events</button>

    <table>
        <thead>
            <tr>
                <th>Time (ms)</th>
                <th>Thread</th>
                <th>State</th>
                <th>Event</th>
                <th>Shared Value</th>
            </tr>
        </thead>
        <tbody id="eventRows"></tbody>
    </table>

    <script>
        /*
          The Java program must generate a file named events.json
          containing its actual recorded execution events.
        */

        let events = [];
        let index = 0;
        let timer = null;

        async function loadEvents() {
            try {
                const response = await fetch("events.json");

                if (!response.ok) {
                    throw new Error("Could not find events.json");
                }

                events = await response.json();

                document.getElementById("eventCount").textContent =
                    events.length;

                document.getElementById("readerCount").textContent =
                    new Set(
                        events.filter(e => e.state === "READING")
                              .map(e => e.name)
                    ).size;

                document.getElementById("writerCount").textContent =
                    new Set(
                        events.filter(e => e.state === "WRITING")
                              .map(e => e.name)
                    ).size;

                document.getElementById("status").textContent =
                    "Loaded " + events.length + " recorded events.";

                showAll();
            } catch (error) {
                document.getElementById("status").textContent =
                    "Execution data not loaded. Run the Java program and " +
                    "generate events.json first.";
            }
        }

        function addRow(event) {
            const row = document.createElement("tr");

            row.className =
                event.state === "READING" ? "reader" : "writer";

            [
                event.time,
                event.name,
                event.state,
                event.message,
                event.value
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            document.getElementById("eventRows").appendChild(row);
        }

        function play() {
            pause();

            if (index >= events.length) {
                index = 0;
                document.getElementById("eventRows").innerHTML = "";
            }

            timer = setInterval(() => {
                if (index >= events.length) {
                    pause();
                    document.getElementById("status").textContent =
                        "Playback completed.";
                    return;
                }

                addRow(events[index]);
                index++;

                document.getElementById("status").textContent =
                    "Showing event " + index + " of " + events.length;
            }, 700);
        }

        function pause() {
            if (timer !== null) {
                clearInterval(timer);
                timer = null;
            }
        }

        function resetView() {
            pause();
            index = 0;
            document.getElementById("eventRows").innerHTML = "";
            document.getElementById("status").textContent =
                "Simulation reset.";
        }

        function showAll() {
            pause();
            document.getElementById("eventRows").innerHTML = "";
            index = 0;

            events.forEach(event => addRow(event));
            index = events.length;

            document.getElementById("status").textContent =
                "Showing all " + events.length + " events.";
        }

        loadEvents();
    </script>
</body>
</html>
