
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dining Philosophers Animation</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f4f9;padding:15px;color:#18345c}
.panel{background:white;border:1px solid #d6e0ee;border-radius:9px;padding:12px;margin:10px 0}
button,select{padding:7px;margin:3px;cursor:pointer}
.scene{position:relative;height:320px;max-width:550px;margin:auto}
.table{position:absolute;width:180px;height:180px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#d5a36c,#ad743d);border:6px solid #80512a;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;text-align:center}
.person{position:absolute;width:85px;padding:10px 3px;background:#64758e;color:white;border-radius:9px;text-align:center;font-size:11px;font-weight:bold}
.person small{display:block;margin-top:4px}
#p0{top:0;left:50%;transform:translateX(-50%)}
#p1{right:0;top:50%;transform:translateY(-50%)}
#p2{bottom:0;left:50%;transform:translateX(-50%)}
#p3{left:0;top:50%;transform:translateY(-50%)}
.fork{position:absolute;border:1px solid #ccd4df;background:white;border-radius:50%;padding:7px;font-size:13px}
#f0{left:34%;top:27%}#f1{right:34%;top:27%}#f2{right:34%;bottom:27%}#f3{left:34%;bottom:27%}
.fork-status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fork-row{padding:8px;border:1px solid #d6e0ee;border-radius:5px;font-size:12px}
#log{font-size:12px;line-height:1.6}
#status{margin:10px 0;font-weight:bold}
input{width:100%}
</style>
</head>
<body>
<h1>Dining Philosophers Problem</h1>
<p>Round-table animation showing four philosophers sharing four forks.</p>

<div class="panel">
<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>
<button onclick="step()">Step</button>
<button onclick="resetView()">Reset</button>
<label>Speed:
<select id="speed">
<option value="1000">Slow</option>
<option value="500" selected>Normal</option>
<option value="200">Fast</option>
</select>
</label>
<input type="range" id="progress" min="0" max="0" value="0" oninput="seek(this.value)">
<div id="status">Loading events...</div>
</div>

<div class="panel">
<h2>Round Table Simulation</h2>
<div class="scene">
<div class="table">ROUND<br>TABLE</div>
<div class="person" id="p0">Philosopher P0<small>THINKING</small></div>
<div class="person" id="p1">Philosopher P1<small>THINKING</small></div>
<div class="person" id="p2">Philosopher P2<small>THINKING</small></div>
<div class="person" id="p3">Philosopher P3<small>THINKING</small></div>
<div class="fork" id="f0">🍴</div><div class="fork" id="f1">🍴</div>
<div class="fork" id="f2">🍴</div><div class="fork" id="f3">🍴</div>
</div>
</div>

<div class="panel">
<h2>Fork Status</h2>
<div class="fork-status" id="forkStatus"></div>
</div>

<div class="panel">
<h2>Execution Event Log</h2>
<ol id="log"></ol>
</div>

<script>
let events=[],index=0,timer=null;
const owners=[-1,-1,-1,-1];

function renderForks(){
 const area=document.getElementById('forkStatus');
 area.innerHTML='';
 for(let i=0;i<4;i++){
  const d=document.createElement('div');
  d.className='fork-row';
  d.textContent='🍴 Fork '+i+': '+(owners[i]===-1?'Available':'Held by Philosopher '+owners[i]);
  area.appendChild(d);
  document.getElementById('f'+i).style.background=owners[i]===-1?'white':'#ffc77d';
 }
}

function draw(e){
 const m=String(e.name).match(/(\d+)/);
 const n=m?Number(m[1]):-1;
 const state=String(e.state).toUpperCase();
 const message=String(e.message);

 if(n>=0&&n<4){
  const p=document.getElementById('p'+n);
  p.innerHTML='Philosopher P'+n+'<small>'+state+'</small>';
 }
 const fm=message.match(/fork\s+(\d+)/i);
 if(fm){
  const f=Number(fm[1]);
  if(f>=0&&f<4){
   if(/picked up/i.test(message))owners[f]=n;
   if(/released/i.test(message))owners[f]=-1;
  }
 }
 renderForks();

 const li=document.createElement('li');
 li.textContent=e.name+' - '+e.state+': '+e.message;
 document.getElementById('log').appendChild(li);
 document.getElementById('status').textContent='Event '+index+' of '+events.length+' | '+e.time+' ms';
 document.getElementById('progress').value=index;
}

function pause(){if(timer!==null)clearInterval(timer);timer=null}
function play(){
 pause();
 if(index>=events.length)resetView();
 timer=setInterval(()=>{
  if(index>=events.length){pause();document.getElementById('status').textContent='Playback complete';return}
  draw(events[index++]);
 },Number(document.getElementById('speed').value));
}
function step(){pause();if(index<events.length)draw(events[index++])}
function resetView(){
 pause();index=0;owners.fill(-1);
 document.getElementById('log').innerHTML='';
 for(let i=0;i<4;i++)document.getElementById('p'+i).innerHTML='Philosopher P'+i+'<small>THINKING</small>';
 document.getElementById('progress').value=0;
 document.getElementById('status').textContent='Ready';
 renderForks();
}
function seek(v){
 pause();resetView();
 while(index<Number(v)&&index<events.length)draw(events[index++]);
}
async function loadEvents(){
 try{
  const response=await fetch('dining_events.json');
  if(!response.ok)throw new Error('Could not find dining_events.json');
  events=await response.json();
  document.getElementById('progress').max=events.length;
  document.getElementById('status').textContent='Loaded '+events.length+' events';
  renderForks();
 }catch(error){
  document.getElementById('status').textContent=
   'Could not load events. Keep this HTML beside dining_events.json and open using VS Code Live Server.';
 }
}
loadEvents();
</script>
</body>
</html>
